federated:
  mode: "finetuning"
  # Set optimizer to "galore_muon" for full-parameter fine-tuning with GaLore+Muon
  # Set optimizer to "muon" for 8-bit Muon with LoRA
  optimizer: "muon"
  trust_beta: 0.1
  # --- Peer trust ---
  trust_init: "uniform"      # uniform | seeded | random(legacy): starting trust of a peer never heard from
  # How a peer is judged each round: "cosine" = update direction alignment only (legacy),
  # "heldout" = loss change on a probe set only, "both" = blend. Falls back to cosine if the probe fails.
  eval_mode: "cosine"
  eval_method: "first_order"  # first_order (one fwd+bwd, cheap) | exact (one forward per peer)
  eval_batches: 4            # probe rows (one sequence each)
  eval_max_len: 1024         # tokens per probe row
  decision_weight: 0.5       # blend: 0 = cosine only, 1 = loss change only
  utility_rel_scale: 0.01    # a 1% probe-loss improvement counts as roughly full marks
  total_epochs: 2  # short run for inference testing

plugins:
  optimizers: []

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  dtype: "bfloat16"
  trust_remote_code: false   # not needed for Qwen2.5
  use_liger_kernel: false

data:
  name: "local"
  train_path: "/mnt/disk1/slakshna/training/Bhaskera/dataset/South_Asia.jsonl"
  tokenized_path: "/mnt/disk1/slakshna/training/Bhaskera/cache/local_train_079a0daaff30bc4e"
  seq_len: 2048
  pack_sequences: true
  format: "chatml"
  max_train_samples: 10000
  
lora:
  # Set enabled to false for full-parameter fine-tuning (e.g. with GaLore+Muon)
  # Set to true if you want to use LoRA adapters (and switch optimizer above)
  enabled: true
  rank: 16
  r: 16        # Bhaskera reads `r` (default 16); `rank` above is read only by ml_engine.py. Keep them equal.
  alpha: 64
  dropout: 0.03
  target_modules: ["q_proj", "v_proj"]

training:
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 3e-4
  warmup_steps: 0
  max_steps: 16
  save_strategy: "steps"
  save_steps: 5
  save_total_limit: 5
  optimizer:
    backend: "default"
    # Kwargs for muon optimizer
    kwargs:
      optim_bits: 8
  distributed:
    strategy: "fsdp" # change to "fsdp" if you want to use fsdp
    fsdp:
      param_dtype: "auto"
      reduce_dtype: "auto"
      buffer_dtype: "auto"
      shard_experts_individually: true
      activation_checkpointing: true
      transformer_layer_cls: []

checkpoint:
  save_directory: "dummy"
  local_interval: 1
  sync_interval: 1
  retention: 1

logging:
  tracker: "wandb"
  project: "M0-dcll-slakshna"
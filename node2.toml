[federation]
id = "slakshna-fl-1"
name = "SLAKSHNA Federation"

[training]
epoch_duration_secs = 300   # Length of one federated epoch
sync_deadline_secs = 100    # How long into the epoch to wait for peer updates
expected_peers = 3          # Release the sync barrier early once this many nodes have reported

[compression]
enabled = true
sparsity = 0.1
quantization = "symmetric_int8"
allow_legacy_delta_format = false
max_payload_bytes = 7340032
max_tensor_elements = 10000000

[node]
id = "node-2"
data_dir = "./data-node2"
gpu_id = 2

[network]
host = "0.0.0.0"
p2p_port = 9001
ws_port = 8547
api_port = 8555
# Optional seed peers, as Iroh EndpointIds. Every entry is an equal member —
# no node here is privileged. Leave empty and this node is still reachable:
# it advertises itself over mDNS and the DHT, and remembers every peer it meets.
peers = []

[discovery]
mdns = true                 # Zero-config discovery of federation members on the local network
dht = true                  # Serverless global lookup over the BitTorrent mainline DHT
dns = true                  # Number 0's public pkarr/DNS lookup; set false for a self-contained federation
relay = false               # Public relays as a fallback transport when hole punching fails

[logging]
level = "info"

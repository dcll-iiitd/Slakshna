[federation]
id = "slakshna-fl-1"
name = "SLAKSHNA Federation"

[training]
epoch_duration_secs = 600
sync_deadline_secs = 300
expected_peers = 6

[compression]
enabled = true
sparsity = 0.1
quantization = "symmetric_int8"
allow_legacy_delta_format = false
max_payload_bytes = 7340032
max_tensor_elements = 10000000

[node]
id = "node-6"
data_dir = "./data-node6"
gpu_id = 5

[network]
host = "0.0.0.0"
p2p_port = 9005
ws_port = 8551
api_port = 8559
peers = []

[discovery]
mdns = true
dht = true
dns = true
relay = false

[logging]
level = "info"

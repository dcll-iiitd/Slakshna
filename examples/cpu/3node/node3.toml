[federation]
id = "slakshna-fl-1"
name = "SLAKSHNA Federation"

[training]
epoch_duration_secs = 600
sync_deadline_secs = 480
expected_peers = 3

[compression]
enabled = true
sparsity = 0.1
quantization = "symmetric_int8"
allow_legacy_delta_format = false
max_payload_bytes = 7340032
max_tensor_elements = 10000000

[node]
id = "node-3"
data_dir = "./data-node3"
device = "cpu"            # no GPU needed: LoRA fine-tune on the CPU
cpu_threads = 5          # cores for this node (3 nodes share this machine)

[network]
host = "0.0.0.0"
p2p_port = 9002
ws_port = 8548
api_port = 8556
peers = []

[discovery]
mdns = true
dht = false
dns = false
relay = false

[logging]
level = "info"

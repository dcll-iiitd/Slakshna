[federation]
id = "slakshna-fl-1"
name = "SLAKSHNA Federation"

[training]
epoch_duration_secs = 900
sync_deadline_secs = 720
expected_peers = 6

[compression]
enabled = true
sparsity = 0.1
quantization = "symmetric_int8"
allow_legacy_delta_format = false
max_payload_bytes = 7340032
max_tensor_elements = 10000000

[node]
id = "node-4"
data_dir = "./data-node4"
device = "cpu"            # no GPU needed: LoRA fine-tune on the CPU
cpu_threads = 2          # cores for this node (6 nodes share this machine)

[network]
host = "0.0.0.0"
p2p_port = 9003
ws_port = 8549
api_port = 8557
peers = []

[discovery]
mdns = true
dht = false
dns = false
relay = false

[logging]
level = "info"

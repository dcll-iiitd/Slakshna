[package]
name = "slakshna"
version = "0.1.0"
edition = "2021"
authors = ["MANant Jain"]
description = "SLAKSHNA - Decentralized peer-to-peer federated learning over an Iroh QUIC mesh"

[[bin]]
name = "iiitd"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
rayon = "1.10.0"
# Web server + WebSocket
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Cryptography
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand = "0.8"
hex = "0.4"
bech32 = "0.11"
rand_chacha = "0.3"
# Database
rocksdb = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utils
uuid = { version = "1.6", features = ["v4", "serde"] }
async-trait = "0.1"
thiserror = "1.0"
futures = "0.3"
tokio-tungstenite = "0.21"
url = "2.4"

# Iroh P2P Networking & Data Sync
iroh = { version = "1.0.2", features = ["test-utils"] }
iroh-gossip = "0.101.0"
iroh-blobs = "0.103.0"

# Serverless peer discovery: mDNS on the local network, BitTorrent mainline DHT
# globally. Together with gossip peer exchange these remove any need for a
# privileged bootstrap node.
iroh-mdns-address-lookup = "0.4"
iroh-mainline-address-lookup = "0.4"

# Steps 4-5 (agents / A2A)
curve25519-dalek = "4.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = "0.5"
base64 = "0.22"
blake3 = "1"
rustls-pki-types = "1"

[dev-dependencies]
rcgen = "0.14"

# Keep the crypto fast in debug/test builds (Ed25519 and VRF checks run in hot loops).
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

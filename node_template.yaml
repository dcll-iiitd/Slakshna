federated:
  mode: finetuning
  optimizer: muon
  trust_beta: 0.1
  trust_init: uniform
  eval_mode: both
  eval_method: first_order
  eval_batches: 4
  eval_max_len: 1024
  decision_weight: 0.5
  utility_rel_scale: 0.01
  total_epochs: 3
plugins:
  optimizers: []
model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  dtype: bfloat16
  trust_remote_code: true
  use_liger_kernel: false
data:
  name: local
  train_path: /mnt/disk1/slakshna/training/Bhaskera/dataset/South_Asia.jsonl
  tokenized_path: /mnt/disk1/slakshna/training/Bhaskera/cache/local_train_079a0daaff30bc4e
  seq_len: 2048
  pack_sequences: true
  format: chatml
  max_train_samples: 1000000
lora:
  enabled: true
  rank: 16
  r: 16
  alpha: 64
  dropout: 0.03
  target_modules:
  - q_proj
  - v_proj
training:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0003
  warmup_steps: 0
  max_steps: 30
  save_strategy: steps
  save_steps: 5
  save_total_limit: 5
  optimizer:
    backend: default
    kwargs:
      optim_bits: 8
  distributed:
    strategy: fsdp
    fsdp:
      param_dtype: auto
      reduce_dtype: auto
      buffer_dtype: auto
      shard_experts_individually: true
      activation_checkpointing: true
      transformer_layer_cls: []
checkpoint:
  save_directory: dummy
  local_interval: 1
  sync_interval: 1
  retention: 1
logging:
  tracker: wandb
  project: M0-dcll-slakshna

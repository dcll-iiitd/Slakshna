[federation]
id = "slakshna-fl-1"
name = "SLAKSHNA Federation"

[training]
epoch_duration_secs = 120
sync_deadline_secs = 90
expected_peers = 2

[compression]
enabled = true
sparsity = 0.1
quantization = "symmetric_int8"
allow_legacy_delta_format = false
max_payload_bytes = 7340032
max_tensor_elements = 2000000000

[node]
id = "node-2"
data_dir = "./data-node2"
gpu_id = 1
num_gpus = 1

[network]
host = "0.0.0.0"
p2p_port = 9001
ws_port = 8547
api_port = 8555
peers = []

[discovery]
mdns = true
dht = true
dns = true
relay = false

[inference]
enabled = true
base_model = "allenai/OLMo-2-1124-7B"   # must match model.name in node_template.yaml
selection = "trust"                      # trust | self | latest
min_trust = 0.0
sidecar_port = 8766
sidecar_python = "Bhaskera-serve/.venv/bin/python"
serve_bhaskera_path = "Bhaskera-serve"
spawn_sidecar = false                  # node2 only hosts its adapter; set true to make it a query node too (port 8766, GPU 1)
serve_only = true

# Optional inference limits (defaults shown):
# fetch_timeout_secs = 30       # wait this long for a missing adapter, then try the next best
# request_timeout_secs = 300    # wait this long for the local model
# max_new_tokens_limit = 1024   # hard cap per query
# chat_template = true          # wrap prompts in the model's chat template
# api_token = "change-me"       # require "Authorization: Bearer ..." on POST /infer

[logging]
level = "info"

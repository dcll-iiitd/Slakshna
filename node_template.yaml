federated:
  mode: "finetuning"
  # Set optimizer to "galore_muon" for full-parameter fine-tuning with GaLore+Muon
  # Set optimizer to "muon" for 8-bit Muon with LoRA
  optimizer: "muon"
  trust_beta: 0.1
  total_epochs: 1  # Total federated rounds/epochs to run (e.g., 10, 20; 0 or omitted = infinite)

plugins:
  optimizers: []

model:
  name: "allenai/OLMo-2-1124-7B"
  dtype: "bfloat16"
  trust_remote_code: true
  use_liger_kernel: false

data:
  name: "local"
  train_path: "/mnt/disk1/slakshna/training/Bhaskera/dataset/South_Asia.jsonl"
  tokenized_path: "/mnt/disk1/slakshna/training/Bhaskera/cache/local_train_079a0daaff30bc4e"
  seq_len: 2048
  pack_sequences: true
  format: "chatml"
  max_train_samples: 10000
  
lora:
  # Set enabled to false for full-parameter fine-tuning (e.g. with GaLore+Muon)
  # Set to true if you want to use LoRA adapters (and switch optimizer above)
  enabled: true
  rank: 16
  alpha: 64
  dropout: 0.03
  target_modules: ["q_proj", "v_proj"]

training:
  batch_size: 28
  gradient_accumulation_steps: 8
  learning_rate: 4.5e-4
  warmup_steps: 0
  max_steps: 7
  save_strategy: "steps"
  save_steps: 5
  save_total_limit: 5
  optimizer:
    backend: "default"
    # Kwargs for muon optimizer
    kwargs:
      optim_bits: 8
  distributed:
    strategy: "fsdp" # change to "fsdp" if you want to use fsdp
    fsdp:
      param_dtype: "auto"
      reduce_dtype: "auto"
      buffer_dtype: "auto"
      shard_experts_individually: true
      activation_checkpointing: true
      transformer_layer_cls: []

checkpoint:
  save_directory: "dummy"
  local_interval: 1
  sync_interval: 1
  retention: 1

logging:
  tracker: "wandb"
  project: "dcll-slakshna-packseq"
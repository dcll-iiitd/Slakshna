[federation]
id = "slakshna-fl-1"
name = "SLAKSHNA Federation"

[training]
epoch_duration_secs = 600
sync_deadline_secs = 300
expected_peers = 2

[compression]
enabled = true
sparsity = 0.1
quantization = "symmetric_int8"
allow_legacy_delta_format = false
max_payload_bytes = 7340032
max_tensor_elements = 2000000000

[node]
id = "node-2"
data_dir = "./data-node2"
gpu_id = 2
num_gpus = 2

[network]
host = "0.0.0.0"
p2p_port = 9001
ws_port = 8547
api_port = 8555
peers = []

[discovery]
mdns = true
dht = true
dns = true
relay = false

# Federated inference (optional). Disabled by default; training is unaffected.
# [inference]
# enabled = true
# base_model = "allenai/OLMo-2-1124-7B"   # must match the training base model
# selection = "trust"                      # trust | self | latest
# min_trust = 0.0
# sidecar_python = "Bhaskera-serve/.venv/bin/python"

[logging]
level = "info"

model:
  name: "Qwen/Qwen2.5-7B"
  dtype: "bfloat16"
  attn_impl: "flash_attention_2"
  trust_remote_code: false
  use_liger_kernel: true

data:
  name: "local_cpt"
  is_cpt: true
  seq_len: 2048
  num_workers: 8

  # Set raw path to null so it skips reading the unstructured JSONL files
  path: null


  # UPDATED: Point this to the exact folder generated by your tokenization run
  # Look inside ./cache/cpt_wikitext/ and copy the folder name (it ends with a 16-char hash)
  tokenized_path: "/scratch/ldls-iiitd/training-framework/cpt/data/local_cpt_b0e6ee1f621c1b74"

lora:
  enabled: false

training:
  batch_size: 120           # You can likely increase this to 8 on an 80GB card with a 1.5B model
  grad_accum: 4
  lr: 2.0e-5
  weight_decay: 0.01
  max_steps: 10000
  num_epochs: 20
  warmup_steps: 15
  max_grad_norm: 1.0

  distributed:
    strategy: "fsdp"

    fsdp:
      sharding_strategy: "FULL_SHARD"            # auto-detect: Qwen2DecoderLayer
      param_dtype: "bfloat16"
      reduce_dtype: "bfloat16"             # float32 not needed — dense is stable
      buffer_dtype: "bfloat16"
      activation_checkpointing: true
checkpoint:
  enabled: true
  save_dir: "./checkpoints/cpt-fsdp-7B"
  save_interval: 1
  keep_last_n: 2

logging:
  tracker: "mlflow"
  project: "bhaskera-cpt"
  run_name: "cpt-fsdp-7b-run"

monitoring:
  dashboard: true
  dashboard_host: "0.0.0.0"
  dashboard_port: 8265
  metrics_export_port: 8080
  metrics:
    enabled: true
    system_every_n_steps: 1
    cuda_every_n_steps: 2
    gpu: true
    cpu: true
    cuda_memory: true
    throughput: true
    peak_tflops_per_gpu: 312
    throughput_window: 5
    throughput_warmup: 5

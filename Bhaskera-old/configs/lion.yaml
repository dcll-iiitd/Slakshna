# Add the plugins block at the top level to tell the framework to import your new file
plugins:
  optimizers:
    - "bhaskera.plugins.optimizers.lion"

model:
  name: "Qwen/Qwen2.5-1.5B"
  dtype: "bfloat16"
  attn_impl: "flash_attention_2"
  trust_remote_code: false
  use_liger_kernel: true

data:
  name: "local_cpt"
  is_cpt: true
  seq_len: 2048
  num_workers: 8
  path: null
  tokenized_path: "/mnt/disk1/Framework/cpt/local_cpt_b0e6ee1f621c1b74"

lora:
  enabled: false

training:
  batch_size: 50
  grad_accum: 4
  
  # The base LR is ignored by the plugin if we override it in the optimizer kwargs below, 
  # but it's good practice to keep it updated for the LR Scheduler.
  # Lion needs a smaller LR than AdamW (was 2.0e-5, changed to 5.0e-6).
  lr: 5.0e-6
  weight_decay: 0.01
  max_steps: 10000
  num_epochs: 20
  warmup_steps: 15
  max_grad_norm: 1.0

  # ── NEW: Pluggable Optimizer Configuration ──
  optimizer:
    backend: "plugin"
    name: "lion"
    kwargs:
      lr: 5.0e-6
      weight_decay: 0.01
      betas: [0.9, 0.99]

  distributed:
    strategy: "ddp"
    ddp:
      find_unused_parameters: false
      gradient_as_bucket_view: true
      broadcast_buffers: false
      activation_checkpointing: true
      static_graph: false

checkpoint:
  enabled: true
  save_dir: "./checkpoints/cpt-ddp-1.5B"
  save_interval: 1
  keep_last_n: 2

logging:
  tracker: "mlflow"
  project: "bhaskera-cpt"
  run_name: "cpt-ddp-1.5b-run-lion"

monitoring:
  dashboard: true
  dashboard_host: "0.0.0.0"
  dashboard_port: 8265
  metrics_export_port: 8080
  metrics:
    enabled: true
    system_every_n_steps: 1
    cuda_every_n_steps: 2
    gpu: true
    cpu: true
    cuda_memory: true
    throughput: true
    peak_tflops_per_gpu: 155.83
    throughput_window: 5
    throughput_warmup: 5

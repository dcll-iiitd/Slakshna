federated:
  mode: "finetuning"
  optimizer: "adamw"
  trust_beta: 0.1

plugins:
  optimizers: []

model:
  name: "TinyLlama/TinyLlama-1.1B-intermediate-step-1431k-3T"
  dtype: "bfloat16"
  trust_remote_code: true
  use_liger_kernel: false

data:
  dataset_name: "timdettmers/openassistant-guanaco"
  tokenized_path: "dummy" # Overridden by ml_engine.py at runtime
  sequence_length: 512
  format_renderer: "chatml"
  max_train_samples: 10000

lora:
  enabled: true
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

training:
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 1e-4
  warmup_steps: 2
  max_steps: 50
  save_strategy: "steps"
  save_steps: 5
  save_total_limit: 1
  optimizer:
    backend: "default"
  distributed:
    strategy: "ddp" # change to "fsdp" if you want to use fsdp
    # fsdp:
    #   param_dtype: "auto"
    #   reduce_dtype: "auto"
    #   buffer_dtype: "auto"
    #   shard_experts_individually: true
    #   activation_checkpointing: true
    #   transformer_layer_cls: []

checkpoint:
  # To be overridden by ml_engine.py
  save_directory: "dummy"
  save_interval: 1
  retention: 1

logging:
  tracker: "none"
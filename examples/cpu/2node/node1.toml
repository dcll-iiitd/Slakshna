[federation]
id = "slakshna-fl-1"
name = "SLAKSHNA Federation"

[training]
epoch_duration_secs = 600
sync_deadline_secs = 480
expected_peers = 2

[compression]
enabled = true
sparsity = 0.1
quantization = "symmetric_int8"
allow_legacy_delta_format = false
max_payload_bytes = 7340032
max_tensor_elements = 10000000

[node]
id = "node-1"
data_dir = "./data-node1"
device = "cpu"            # no GPU needed: LoRA fine-tune on the CPU
cpu_threads = 8          # cores for this node (2 nodes share this machine)

[network]
host = "0.0.0.0"
p2p_port = 9000
ws_port = 8546
api_port = 8545
peers = []

[discovery]
mdns = true
dht = false
dns = false
relay = false

[logging]
level = "info"

[federation]
id = "slakshna-fl-1"
name = "SLAKSHNA Federation"

[training]
epoch_duration_secs = 600
sync_deadline_secs = 480
expected_peers = 4

[compression]
enabled = true
sparsity = 0.1
quantization = "symmetric_int8"
allow_legacy_delta_format = false
max_payload_bytes = 7340032
max_tensor_elements = 10000000

[node]
id = "node-2"
data_dir = "./data-node2"
device = "cpu"            # no GPU needed: LoRA fine-tune on the CPU
cpu_threads = 4          # cores for this node (4 nodes share this machine)

[network]
host = "0.0.0.0"
p2p_port = 9001
ws_port = 8547
api_port = 8555
peers = []

[discovery]
mdns = true
dht = false
dns = false
relay = false

[logging]
level = "info"
